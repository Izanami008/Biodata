<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
}

header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    padding:16px 8%;
    background:#1e293b;
}

.logo{
    color:#00ffcc;
    font-size:20px;
    font-weight:bold;
}

.header-right{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}

.btn{
    border:none;
    cursor:pointer;
    background:#00ffcc;
    color:#000;
    font-weight:bold;
    padding:8px 12px;
    border-radius:8px;
    text-decoration:none;
    font-size:13px;
}

.container{
    padding:28px 8%;
}

.topbar{
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:22px;
}

.search{
    width:280px;
    max-width:100%;
    padding:11px 12px;
    border:none;
    outline:none;
    border-radius:8px;
    background:#1e293b;
    color:#fff;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

.card{
    background:#1e293b;
    border:1px solid rgba(0,255,204,.08);
    border-radius:14px;
    padding:14px;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#00ffcc;
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:10px;
    background:#0f172a;
}

.card h3{
    margin-top:10px;
    overflow-wrap:anywhere;
}

.price{
    color:#00ffcc;
    font-weight:bold;
    margin-top:6px;
}

.stock{
    font-size:13px;
    opacity:.75;
    margin-top:4px;
}

.desc{
    font-size:14px;
    opacity:.85;
    margin-top:8px;
    line-height:1.5;
    overflow-wrap:anywhere;
}

.card button{
    width:100%;
    margin-top:12px;
    padding:9px;
    border:none;
    border-radius:8px;
    background:#00ffcc;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.card button:disabled{
    background:#64748b;
    cursor:not-allowed;
}

.cart{
    position:fixed;
    top:0;
    right:-380px;
    width:min(340px,90vw);
    height:100%;
    background:#1e293b;
    padding:20px;
    transition:.3s;
    overflow:auto;
    z-index:40;
    box-shadow:-5px 0 20px #0004;
}

.cart.show{
    right:0;
}

.close-cart{
    float:right;
    background:#ef4444;
    color:white;
    border:none;
    border-radius:6px;
    padding:5px 10px;
    cursor:pointer;
}

.cart-item{
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    overflow-wrap:anywhere;
}

.remove{
    border:none;
    background:#ef4444;
    color:#fff;
    padding:5px 8px;
    border-radius:6px;
    cursor:pointer;
}

.total{
    margin-top:12px;
    color:#00ffcc;
    font-weight:bold;
}

.checkout{
    margin-top:12px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#00ffcc;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.badge{
    background:#ef4444;
    color:#fff;
    font-size:12px;
    padding:2px 7px;
    border-radius:999px;
}

.empty{
    opacity:.7;
    padding:20px;
    text-align:center;
}

@media(max-width:600px){
    header{
        padding:14px 4%;
    }

    .container{
        padding:20px 4%;
    }

    .header-right{
        gap:6px;
    }

    .btn{
        padding:8px 9px;
        font-size:12px;
    }

    .products{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .card{
        padding:9px;
    }

    .card img{
        height:130px;
    }

    .card h3{
        font-size:15px;
    }

    .price{
        font-size:13px;
    }

    .desc{
        font-size:12px;
    }
}

@media(max-width:350px){
    .products{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MARKETPLACE</div>

    <div class="header-right">
        <a href="orders.html" class="btn">Riwayat</a>
        <a href="endorse.html" class="btn">Endorse</a>
        <button class="btn" onclick="toggleCart()">
            🛒 <span class="badge" id="cartCount">0</span>
        </button>
        <button class="btn" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">

    <div class="topbar">
        <input
            class="search"
            id="search"
            placeholder="Cari produk..."
            oninput="loadProducts()"
        >
    </div>

    <div class="products" id="productList"></div>

</div>

<div class="cart" id="cart">
    <button class="close-cart" onclick="toggleCart()">Tutup</button>
    <h3>Keranjang</h3>

    <div id="cartItems"></div>
    <p class="total" id="total">Total: Rp 0</p>

    <button class="checkout" onclick="checkout()">Bayar</button>
</div>

<script>
"use strict";

// ===== CEK LOGIN =====
let user = localStorage.getItem("user");

if(user !== "user"){
    window.location.href = "../login.html";
}

// ===== DATA BERSAMA =====
let products = readStorage("products", []);
let cart = readStorage("cart", []);

function readStorage(key, fallback){
    try{
        const value = JSON.parse(localStorage.getItem(key));
        return value === null ? fallback : value;
    }catch(error){
        return fallback;
    }
}

function saveProducts(){
    localStorage.setItem("products", JSON.stringify(products));
}

function saveCart(){
    localStorage.setItem("cart", JSON.stringify(cart));
    document.getElementById("cartCount").innerText = cart.length;
}

// ===== FORMAT RUPIAH =====
function rupiah(value){
    return "Rp " + Number(value || 0).toLocaleString("id-ID");
}

// ===== TAMPILKAN PRODUK =====
function loadProducts(){
    const keyword = document.getElementById("search")
        .value.trim().toLowerCase();

    const filtered = products
        .map((product, index) => ({product, index}))
        .filter(item => {
            const p = item.product;
            return String(p.name || "")
                .toLowerCase().includes(keyword);
        });

    const list = document.getElementById("productList");

    if(filtered.length === 0){
        list.innerHTML =
            '<div class="empty">Belum ada produk yang cocok.</div>';
        return;
    }

    list.innerHTML = filtered.map(({product:p, index:i}) => {
        const name = escapeHTML(p.name || "Produk");
        const desc = escapeHTML(p.desc || "Tidak ada deskripsi");
        const image = safeImage(p.image);
        const price = Number(p.price) || 0;
        const stock = Math.max(0, Number(p.stock) || 0);

        return `
        <div class="card">
            <img
                src="${image}"
                alt="${name}"
                onerror="this.onerror=null;this.src='';this.style.display='none';"
            >
            <h3>${name}</h3>
            <div class="price">${rupiah(price)}</div>
            <div class="stock">Stok: ${stock}</div>
            <div class="desc">${desc}</div>
            <button
                onclick="addCart(${i})"
                ${stock <= 0 ? "disabled" : ""}
            >${stock <= 0 ? "Stok Habis" : "Tambah ke Keranjang"}</button>
        </div>`;
    }).join("");
}

function escapeHTML(value){
    return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);
}

function safeImage(value){
    const image = String(value || "");
    if(/^data:image\/|^https?:\/\//i.test(image) ||
       /^(?:\.\.?\/|\/|img\/)/i.test(image)){
        return escapeHTML(image);
    }
    return "";
}

// ===== TAMBAH KERANJANG =====
function addCart(i){
    const product = products[i];

    if(!product){
        alert("Produk tidak ditemukan.");
        return;
    }

    if(Number(product.stock) <= 0){
        alert("Stok habis.");
        return;
    }

    cart.push({
        name: product.name,
        price: Number(product.price) || 0,
        image: product.image || "",
        productIndex: i
    });

    product.stock = Number(product.stock) - 1;

    saveProducts();
    saveCart();
    renderCart();
    loadProducts();
}

// ===== HAPUS DARI KERANJANG =====
function removeCart(i){
    const item = cart[i];

    if(!item) return;

    // Kembalikan stok produk yang tepat.
    const product = products[item.productIndex];

    if(product){
        product.stock = Number(product.stock || 0) + 1;
    }

    cart.splice(i, 1);

    saveProducts();
    saveCart();
    renderCart();
    loadProducts();
}

// ===== TAMPILKAN KERANJANG =====
function renderCart(){
    let total = 0;

    const items = document.getElementById("cartItems");

    if(cart.length === 0){
        items.innerHTML =
            '<div class="empty">Keranjang masih kosong.</div>';
    }else{
        items.innerHTML = cart.map((p, i) => {
            total += Number(p.price) || 0;

            return `
            <div class="cart-item">
                <div>
                    ${escapeHTML(p.name || "Produk")}<br>
                    <span class="price">${rupiah(p.price)}</span>
                </div>
                <button class="remove" onclick="removeCart(${i})">×</button>
            </div>`;
        }).join("");
    }

    document.getElementById("total").innerText =
        "Total: " + rupiah(total);

    document.getElementById("cartCount").innerText = cart.length;
}

function toggleCart(){
    document.getElementById("cart").classList.toggle("show");
}

// ===== CHECKOUT =====
function checkout(){
    if(cart.length === 0){
        alert("Keranjang masih kosong.");
        return;
    }

    const total = cart.reduce(
        (sum, item) => sum + (Number(item.price) || 0), 0
    );

    const orders = readStorage("orders", []);

    orders.push({
        id: "ORD-" + Date.now(),
        date: new Date().toLocaleString("id-ID"),
        status: "Berhasil",
        items: [...cart],
        total: total
    });

    localStorage.setItem("orders", JSON.stringify(orders));

    cart = [];
    saveCart();
    renderCart();
    loadProducts();

    document.getElementById("cart").classList.remove("show");

    alert("Pesanan berhasil disimpan ke riwayat.");
}

// ===== LOGOUT =====
function logout(){
    // Kembalikan stok barang yang belum dibeli.
    cart.forEach(item => {
        const product = products[item.productIndex];

        if(product){
            product.stock = Number(product.stock || 0) + 1;
        }
    });

    saveProducts();

    localStorage.removeItem("user");
    localStorage.removeItem("cart");

    window.location.href = "../login.html";
}

// ===== SINKRON DATA DARI TAB LAIN =====
window.addEventListener("storage", function(event){
    if(event.key === "products"){
        products = readStorage("products", []);
        loadProducts();
    }

    if(event.key === "user"){
        if(localStorage.getItem("user") !== "user"){
            window.location.href = "../login.html";
        }
    }
});

// ===== MULAI =====
loadProducts();
renderCart();
saveCart();
</script>

</body>
    </html>
