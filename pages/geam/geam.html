<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Anime Fight Ultimate</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-user-select:none;
user-select:none;
touch-action:none;
}

body{

overflow:hidden;

background:#000;

font-family:Arial,sans-serif;

}

canvas{

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:#000;

}

/* ====================== */
/* UI */
/* ====================== */

.ui{

position:absolute;

top:12px;

left:0;

width:100%;

display:flex;

justify-content:space-between;

padding:0 20px;

z-index:100;

pointer-events:none;

}

.playerPanel,
.enemyPanel{

width:38%;

}

.energyPanel{

position:absolute;

left:50%;

top:70px;

transform:translateX(-50%);

width:220px;

}

.label{

color:white;

font-size:18px;

font-weight:bold;

margin-bottom:6px;

text-shadow:0 0 8px cyan;

}

.bar{

height:22px;

background:#111;

border-radius:25px;

overflow:hidden;

border:2px solid rgba(255,255,255,.4);

box-shadow:

0 0 15px rgba(0,255,255,.35);

}

.hp{

height:100%;

width:100%;

background:

linear-gradient(

90deg,

#ff1a1a,

#ff7700

);

}

.energy{

height:100%;

width:100%;

background:

linear-gradient(

90deg,

#00ffff,

#0066ff

);

}

/* ====================== */
/* CONTROL */
/* ====================== */

.controls{

position:fixed;

left:0;

bottom:25px;

width:100%;

display:flex;

justify-content:space-between;

align-items:flex-end;

padding:0 20px;

z-index:200;

}

/* ====================== */
/* ANALOG */
/* ====================== */

#analog{

width:170px;

height:170px;

border-radius:50%;

background:

rgba(255,255,255,.08);

border:

3px solid rgba(0,255,255,.5);

position:relative;

backdrop-filter:blur(10px);

box-shadow:

0 0 30px cyan;

}

#stick{

width:70px;

height:70px;

border-radius:50%;

position:absolute;

left:50px;

top:50px;

background:

linear-gradient(

#00ffd5,

#00a86b

);

box-shadow:

0 0 20px cyan;

}

/* ====================== */
/* BUTTON */
/* ====================== */

.buttons{

display:grid;

grid-template-columns:

repeat(2,110px);

gap:16px;

}

button{

width:110px;

height:110px;

border:none;

border-radius:50%;

font-size:34px;

font-weight:bold;

color:white;

box-shadow:

0 0 25px rgba(255,255,255,.35);

transition:.15s;

}

button:active{

transform:scale(.9);

}

#skill1{

background:

linear-gradient(

#36d7ff,

#004dff

);

}

#skill2{

background:

linear-gradient(

#ffc400,

#ff5a00

);

}

#skill3{

background:

linear-gradient(

#ff0000,

#660000

);

}

#dash{

background:

linear-gradient(

#8b5cf6,

#3b82f6

);

}

</style>

</head>

<body>

<canvas id="gameCanvas"></canvas>

<div class="ui">

<div class="playerPanel">

<div class="label">

PLAYER

</div>

<div class="bar">

<div
id="playerHP"
class="hp">

</div>

</div>

</div>

<div class="enemyPanel">

<div class="label">

ENEMY

</div>

<div class="bar">

<div
id="enemyHP"
class="hp">

</div>

</div>

</div>

<div class="energyPanel">

<div class="label">

ENERGY

</div>

<div class="bar">

<div
id="energyBar"
class="energy">

</div>

</div>

</div>

</div>

<div class="controls">

<div id="analog">

<div id="stick">

</div>

</div>

<div class="buttons">

<button id="skill1">

⚔️

</button>

<button id="skill2">

⚡

</button>

<button id="skill3">

💥

</button>

<button id="dash">

💨

</button>

</div>

</div>

<script>
  // =========================
// CANVAS
// =========================
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const WIDTH=window.innerWidth;
const HEIGHT=window.innerHeight;

const dpr=window.devicePixelRatio||1;

canvas.width=WIDTH*dpr;
canvas.height=HEIGHT*dpr;

canvas.style.width=WIDTH+"px";
canvas.style.height=HEIGHT+"px";

ctx.scale(dpr,dpr);

// =========================
// SPRITE
// =========================
const playerImg=new Image();
playerImg.src="png/character.png";

const frameW=333;
const frameH=333;

let frameX=0;
let frameY=0;
let frameTick=0;

let facing=1;

// =========================
// PLAYER
// =========================
const player={

x:120,
y:340,

w:170,
h:170,

speed:5,

hp:100,

energy:0

};

// =========================
// ENEMY
// =========================
const enemy={

x:720,
y:330,

w:150,
h:150,

hp:100,

speed:1.6

};

// =========================
// CONTROL
// =========================
let moveX=0;
let moveY=0;

const analog=document.getElementById("analog");
const stick=document.getElementById("stick");

analog.addEventListener("touchmove",e=>{

e.preventDefault();

let rect=analog.getBoundingClientRect();

let x=e.touches[0].clientX-rect.left-85;
let y=e.touches[0].clientY-rect.top-85;

let dist=Math.hypot(x,y);

let max=55;

if(dist>max){

x=x/dist*max;
y=y/dist*max;

}

stick.style.left=(x+85-35)+"px";
stick.style.top=(y+85-35)+"px";

moveX=x/max;
moveY=y/max;

});

analog.addEventListener("touchend",()=>{

moveX=0;
moveY=0;

stick.style.left="50px";
stick.style.top="50px";

});

// =========================
// COMBO
// =========================
let comboStep=0;
let comboTimer=0;

// =========================
// SKILL
// =========================
let skill2=false;
let dash=false;

let ulti=false;
let ultiTimer=0;

// =========================
// BUTTON
// =========================
skill1.onclick=()=>{

comboStep++;

comboTimer=18;

if(comboStep>3)
comboStep=1;

};

skill2.onclick=()=>{

skill2=true;

setTimeout(()=>{

skill2=false;

},350);

};

dash.onclick=()=>{

player.x+=facing*90;

};

skill3.onclick=()=>{

if(player.energy>=100){

player.energy=0;

ulti=true;

ultiTimer=0;

}

};

  ctx.clearRect(0,0,WIDTH,HEIGHT);

// LANGIT
let bg=ctx.createLinearGradient(0,0,0,HEIGHT);

bg.addColorStop(0,"#061d39");
bg.addColorStop(.6,"#132f5c");
bg.addColorStop(1,"#030303");

ctx.fillStyle=bg;
ctx.fillRect(0,0,WIDTH,HEIGHT);

// Bulan
ctx.shadowBlur=30;
ctx.shadowColor="white";

ctx.beginPath();
ctx.arc(WIDTH/2,90,45,0,Math.PI*2);

ctx.fillStyle="#fffde7";

ctx.fill();

ctx.shadowBlur=0;

// Ring Duel
ctx.beginPath();

ctx.fillStyle="#303030";

ctx.ellipse(

WIDTH/2,
HEIGHT-120,

420,
90,

0,
0,
Math.PI*2

);

ctx.fill();

ctx.lineWidth=4;
ctx.strokeStyle="#00ffff";
ctx.stroke();
  // ===========================
// PLAYER MOVE
// ===========================

player.x += moveX * player.speed;
player.y += moveY * player.speed;

player.x = Math.max(0,Math.min(WIDTH-player.w,player.x));
player.y = Math.max(100,Math.min(HEIGHT-220,player.y));

if(moveX>0.1) facing=1;
if(moveX<-0.1) facing=-1;

// ===========================
// PLAYER SHADOW
// ===========================

ctx.fillStyle="rgba(0,0,0,.35)";

ctx.beginPath();

ctx.ellipse(
player.x+player.w/2,
player.y+player.h-5,
55,
14,
0,
0,
Math.PI*2
);

ctx.fill();

// ===========================
// ENEMY SHADOW
// ===========================

ctx.beginPath();

ctx.ellipse(
enemy.x+enemy.w/2,
enemy.y+enemy.h-5,
50,
12,
0,
0,
Math.PI*2
);

ctx.fill();

// ===========================
// PLAYER AURA
// ===========================

ctx.save();

ctx.shadowBlur=35;
ctx.shadowColor="#00ffff";

ctx.beginPath();

ctx.arc(
player.x+player.w/2,
player.y+player.h/2,
55,
0,
Math.PI*2
);

ctx.fillStyle="rgba(0,255,255,.12)";
ctx.fill();

ctx.restore();

// ===========================
// ENEMY AI
// ===========================

let dx=player.x-enemy.x;
let dy=player.y-enemy.y;

let dist=Math.hypot(dx,dy);

if(dist>110){

enemy.x+=dx/dist*enemy.speed;
enemy.y+=dy/dist*enemy.speed;

}

if(dist<90){

player.hp-=0.08;

}

// ===========================
// ANIMATION
// ===========================

let moving=Math.abs(moveX)>0.05||
Math.abs(moveY)>0.05;

if(comboStep==1) frameY=2;
else if(comboStep==2) frameY=3;
else if(comboStep==3) frameY=4;
else if(moving) frameY=1;
else frameY=0;

frameTick++;

if(frameTick>6){

frameTick=0;

frameX++;

if(frameX>=4)
frameX=0;

}

// ===========================
// SKILL EFFECT
// ===========================

if(skill2){

ctx.save();

ctx.strokeStyle="#00ffff";

ctx.lineWidth=8;

ctx.shadowBlur=25;

ctx.shadowColor="#00ffff";

ctx.beginPath();

ctx.moveTo(
player.x+80,
player.y+70
);

ctx.lineTo(
enemy.x+60,
enemy.y+60
);

ctx.stroke();

for(let i=0;i<20;i++){

ctx.beginPath();

ctx.fillStyle="cyan";

ctx.arc(

player.x+40+
Math.random()*80,

player.y+30+
Math.random()*90,

2+
Math.random()*5,

0,
Math.PI*2

);

ctx.fill();

}

ctx.restore();

if(dist<150){

enemy.hp-=0.6;

}

}

// ===========================
// ULTIMATE
// ===========================

if(ulti){

ultiTimer++;

ctx.fillStyle="rgba(255,255,255,.08)";
ctx.fillRect(0,0,WIDTH,HEIGHT);

for(let i=0;i<40;i++){

ctx.beginPath();

ctx.fillStyle="cyan";

ctx.arc(

Math.random()*WIDTH,

Math.random()*HEIGHT,

Math.random()*6,

0,

Math.PI*2

);

ctx.fill();

}

if(ultiTimer>45){

ulti=false;

enemy.hp-=30;

}

}

// ===========================
// ENERGY
// ===========================

player.energy+=0.12;

if(player.energy>100)
player.energy=100;

// ===========================
// UI
// ===========================

playerHP.style.width=player.hp+"%";
enemyHP.style.width=enemy.hp+"%";
energyBar.style.width=player.energy+"%";
