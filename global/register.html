
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Izanami</title>

<style>
* { box-sizing: border-box; }

body {
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

.box {
    background: #1e293b;
    padding: 32px;
    border-radius: 15px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 0 20px rgba(0,255,204,0.3);
    text-align: center;
}

h2 { margin-top: 0; }

.profile-img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 12px;
    border: 2px solid #00ffcc;
}

input {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #00ffcc;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    min-height: 20px;
    font-size: 14px;
    color: #fca5a5;
}

.message.success { color: #86efac; }

a {
    color: #00ffcc;
    text-decoration: none;
    font-weight: bold;
}

.home-icon {
    display: block;
    margin-top: 20px;
    font-size: 30px;
}
</style>
</head>

<body>
<div class="box">
    <h2>Buat Akun Izanami</h2>

    <img
        src="../img/default-profile.png"
        alt="Profile"
        class="profile-img"
    >

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <form id="registerForm">
        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Nama lengkap"
            autocomplete="name"
            maxlength="150"
            required
        >

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username (3–80 karakter)"
            autocomplete="username"
            minlength="3"
            maxlength="80"
            pattern="[A-Za-z0-9_.-]+"
            title="Gunakan huruf, angka, titik, garis bawah, atau tanda hubung."
            required
        >

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            autocomplete="email"
            maxlength="190"
            required
        >

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password (minimal 8 karakter)"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Ulangi password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            required
        >

        <button type="submit" id="registerButton">
            Register
        </button>
    </form>

    <p>Sudah punya akun? <a href="login.html">Login</a></p>

    <a href="../index.html" class="home-icon" title="Halaman Utama">🏠</a>
</div>

<script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    message.textContent = "";
    message.classList.remove("success");

    const fullname = document.getElementById("fullname").value.trim();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent = "Konfirmasi password tidak cocok.";
        return;
    }

    if (password.length < 8) {
        message.textContent = "Password minimal 8 karakter.";
        return;
    }

    button.disabled = true;
    button.textContent = "Mendaftarkan...";

    try {
        const response = await fetch("../api/register.php", {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                fullname,
                username,
                email,
                password
            })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Registrasi gagal.");
        }

        message.textContent = "Registrasi berhasil! Mengalihkan ke login...";
        message.classList.add("success");
        form.reset();

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1000);

    } catch (error) {
        message.textContent =
            error.message === "Failed to fetch"
                ? "Server tidak dapat dihubungi. Periksa API dan koneksi."
                : error.message || "Terjadi kesalahan saat registrasi.";
    } finally {
        button.disabled = false;
        button.textContent = "Register";
    }
});
</script>
</body>
    </html>
