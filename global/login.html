
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Izanami</title>

<style>
* { box-sizing: border-box; }

body {
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

.box {
    background: #1e293b;
    padding: 32px;
    border-radius: 15px;
    width: 100%;
    max-width: 350px;
    box-shadow: 0 0 20px rgba(0,255,204,0.3);
    text-align: center;
}

.box h2 { margin-bottom: 20px; }

input[type="text"],
input[type="password"] {
    display: block;
    padding: 12px;
    margin: 10px 0;
    width: 100%;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
}

button {
    padding: 12px;
    width: 100%;
    margin-top: 10px;
    background: #00ffcc;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.error {
    color: #fca5a5;
    margin-bottom: 10px;
    min-height: 18px;
    font-size: 14px;
}

.success {
    color: #86efac;
}

p.register-text { margin-top: 15px; }

p.register-text a {
    color: #00ffcc;
    text-decoration: none;
    font-weight: bold;
}

.home-icon {
    display: block;
    margin: 20px auto 0;
    font-size: 30px;
    color: #00ffcc;
    text-decoration: none;
}

.profile-img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
    border: 2px solid #00ffcc;
}
</style>
</head>

<body>
<div class="box">
    <h2>Login</h2>

    <img
        src="../img/default-profile.png"
        alt="Profile"
        class="profile-img"
        id="profilePreview"
    >

    <p class="error" id="errorMsg" role="status" aria-live="polite"></p>

    <form id="loginForm">
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">Login</button>
    </form>

    <p class="register-text">
        Belum punya akun?
        <a href="register.html">Register</a>
    </p>

    <a href="../index.html" class="home-icon" title="Halaman Utama">🏠</a>
</div>

<script>
const form = document.getElementById("loginForm");
const errorMsg = document.getElementById("errorMsg");
const loginButton = document.getElementById("loginButton");

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    errorMsg.textContent = "";
    errorMsg.classList.remove("success");
    loginButton.disabled = true;
    loginButton.textContent = "Memeriksa...";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("../api/auth.php?action=login", {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Login gagal.");
        }

        // Role dan identitas harus berasal dari server.
        // Jangan simpan password atau menentukan role sendiri di browser.
        errorMsg.textContent = "Login berhasil. Mengalihkan...";
        errorMsg.classList.add("success");

        if (result.user.role === "admin") {
            window.location.replace("admin.html");
        } else {
            window.location.replace("user.html");
        }

    } catch (error) {
        errorMsg.textContent =
            error.message === "Failed to fetch"
                ? "Server tidak dapat dihubungi. Periksa koneksi dan API."
                : error.message || "Terjadi kesalahan saat login.";
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }
});
</script>
</body>
</html>
