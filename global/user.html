/* RADAR */
.radar-wrapper{
    width:min(92vw,420px);
    aspect-ratio:1/1;
    margin:10px auto 20px;
    position:relative;
}

.radar{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid #00cfff;
    box-shadow:
        0 0 20px #00cfff,
        inset 0 0 30px rgba(0,207,255,.25);
    overflow:hidden;

    background:
        repeating-radial-gradient(
            circle,
            transparent 0 54px,
            rgba(0,200,255,.35) 55px 56px
        ),
        linear-gradient(
            transparent 49.7%,
            rgba(0,200,255,.35) 50%,
            transparent 50.3%
        ),
        linear-gradient(
            90deg,
            transparent 49.7%,
            rgba(0,200,255,.35) 50%,
            transparent 50.3%
        ),
        radial-gradient(
            circle,
            rgba(0,200,255,.18),
            rgba(0,20,35,.95)
        );
}

/* radar sweep */
.radar::after{
    content:"";
    position:absolute;
    width:50%;
    height:50%;
    left:50%;
    top:50%;
    transform-origin:0 0;

    background:
        conic-gradient(
            from 0deg,
            rgba(0,255,150,.5),
            rgba(0,255,150,.12),
            transparent 75%
        );

    animation:scan 2.8s linear infinite;
}

@keyframes scan{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.center{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#00ffff;
    box-shadow:
        0 0 10px #00ffff,
        0 0 30px #00ffff;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:5;
}

/* directions */
.direction{
    position:absolute;
    color:#43dcff;
    font-weight:bold;
    text-shadow:0 0 8px #00bfff;
    z-index:6;
}

.n{top:5px;left:50%;transform:translateX(-50%);}
.s{bottom:5px;left:50%;transform:translateX(-50%);}
.e{right:7px;top:50%;transform:translateY(-50%);}
.w{left:7px;top:50%;transform:translateY(-50%);}

/* WIFI DOT */
.wifi-dot{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    z-index:10;
    cursor:pointer;
    animation:pulse 1.5s infinite;
}

.wifi-dot::after{
    content:"";
    position:absolute;
    inset:-8px;
    border:1px solid currentColor;
    border-radius:50%;
    opacity:.4;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.35);
    }
}

.strong{
    background:#00ff88;
    color:#00ff88;

}

.medium{

}

/* MODAL */
.modal{
    display:none;

}

.modal-box{

}

}

.status{

    font-size:12px;

</style>

<script>

/* ==========================================
   USER SYSTEM
========================================== */

const user =
    JSON.parse(
        localStorage.getItem("currentUser")
    );

if(!user){

    window.location.href = "login.html";

}else{

    document.getElementById("foto").src =
        user.foto || "https://via.placeholder.com/100";

    document.getElementById("nama").innerText =
        user.nama || "User";

    document.getElementById("email").innerText =
        user.email || "";

}


/* ==========================================
   LOGOUT
========================================== */

function logout(){

    localStorage.removeItem("currentUser");

    window.location.href =
        "login.html";
}


/* ==========================================
   WIFI DATA
   ------------------------------------------
   DATA DI BAWAH ADALAH DATA DEMO.
   BROWSER TIDAK DAPAT MELAKUKAN SCAN SSID
   WIFI SEKITAR SECARA LANGSUNG.
========================================== */

const wifiNetworks = [

    {
        ssid:"RumahKu",
        signal:-52,
        security:"WPA2",
        frequency:"2.4 GHz",
        distance:"12 m",
        type:"strong",
        x:25,
        y:55
    },

    {
        ssid:"@wifi.id",
        signal:-65,
        security:"WPA2",
        frequency:"2.4 GHz",
        distance:"38 m",
        type:"strong",
        x:58,
        y:42
    },

    {
        ssid:"Kopi Kenangan",
        signal:-68,
        security:"WPA2",
        frequency:"2.4 GHz",
        distance:"62 m",
        type:"strong",
        x:72,
        y:27
    },

    {
        ssid:"Cafe Gratis",
        signal:-74,
        security:"Open",
        frequency:"2.4 GHz",
        distance:"85 m",
        type:"medium",
        x:80,
        y:50
    },

    {
        ssid:"GalaxyNet",
        signal:-76,
        security:"WPA2",
        frequency:"5 GHz",
        distance:"102 m",
        type:"medium",
        x:67,
        y:70
    },

    {
        ssid:"Indomaret WiFi",
        signal:-72,
        security:"Open",
        frequency:"2.4 GHz",
        distance:"125 m",
        type:"medium",
        x:32,
        y:30
    },

    {
        ssid:"TP-Link_3F2A",
        signal:-81,
        security:"WPA/WPA2",
        frequency:"2.4 GHz",
        distance:"158 m",
        type:"medium",
        x:15,
        y:38
    },

    {
        ssid:"BCA Hotspot",
        signal:-88,
        security:"WPA2",
        frequency:"5 GHz",
        distance:"201 m",
        type:"weak",
        x:40,
        y:78
    }

];


let selectedWifi = null;


/* ==========================================
   RENDER WIFI
========================================== */

function renderWifi(){

    const list =
        document.getElementById("wifiList");

    const radar =
        document.getElementById("radar");

    list.innerHTML = "";

    /*
     * Hapus titik radar lama
     */
    document
        .querySelectorAll(".wifi-dot")
        .forEach(dot => dot.remove());


    document.getElementById("wifiCount")
        .innerText = wifiNetworks.length;


    wifiNetworks.forEach((wifi,index)=>{

        /* ------------------------------
           RADAR DOT
        ------------------------------ */

        const dot =
            document.createElement("div");

        dot.className =
            "wifi-dot " + wifi.type;

        dot.style.left =
            wifi.x + "%";

        dot.style.top =
            wifi.y + "%";

        dot.innerHTML =
            `<span class="dot-label">
                ${wifi.ssid}
            </span>`;

        dot.onclick = () => {
            openConnect(wifi);
        };

        radar.appendChild(dot);


        /* ------------------------------
           WIFI CARD
        ------------------------------ */

        const card =
            document.createElement("div");

        card.className =
            "wifi-card";


        card.innerHTML = `

            <div class="wifi-icon">
                ðŸ“¶
            </div>

            <div class="wifi-details">

                <div class="wifi-name">
                    ${escapeHtml(wifi.ssid)}
                </div>

                <div class="wifi-meta">
                    ðŸ” ${wifi.security}
                    &nbsp; | &nbsp;
                    ðŸ“» ${wifi.frequency}
                </div>

                <div class="signal">
                    ðŸ“¶ ${wifi.signal} dBm
                    &nbsp; â€¢ &nbsp;
                    ðŸ“ ${wifi.distance}
                </div>

            </div>

            <button class="connect">
                CONNECT
            </button>
        `;


        card
            .querySelector(".connect")
            .onclick = () => {
                openConnect(wifi);
            };


        list.appendChild(card);

    });

}


/* ==========================================
   SCAN ANIMATION
========================================== */

function scanWifi(){

    const status =
        document.getElementById("scanStatus");

    status.innerText =
        "SCAN";

    showStatus(
        "ðŸ“¡ Radar sedang melakukan scanning..."
    );


    setTimeout(()=>{

        status.innerText =
            "READY";

        renderWifi();

        showStatus(
            "âœ… Scanning selesai â€” " +
            wifiNetworks.length +
            " jaringan ditemukan"
        );

    },1800);

}


/* ==========================================
   CONNECT MODAL
========================================== */

function openConnect(wifi){

    selectedWifi = wifi;

    document.getElementById(
        "modalWifiName"
    ).innerText =
        "ðŸ“¡ " + wifi.ssid;

    document.getElementById(
        "passwordInput"
    ).value = "";

    document.getElementById(
        "connectModal"
    ).style.display = "flex";

}


function closeModal(){

    document.getElementById(
        "connectModal"
    ).style.display = "none";

    selectedWifi = null;

}


/* ==========================================
   CONNECT
   ------------------------------------------
   Browser tidak memiliki API umum untuk
   menghubungkan perangkat ke Wi-Fi secara
   langsung.
========================================== */

function connectWifi(){

    if(!selectedWifi)
        return;


    const password =
        document.getElementById(
            "passwordInput"
        ).value;


    if(!password){

        showStatus(
            "âš ï¸ Masukkan password terlebih dahulu"
        );

        return;
    }


    closeModal();


    showStatus(
        "ðŸ” Password diterima. " +
        "Silakan sambungkan melalui pengaturan Wi-Fi Android."
    );


    /*
     * Tidak ada kode pembobolan password di sini.
     * Password hanya digunakan sebagai input pengguna.
     */

}


/* ==========================================
   STATUS MESSAGE
========================================== */

let statusTimer;


function showStatus(message){

    const status =
        document.getElementById(
            "statusMessage"
        );


    status.innerText =
        message;

    status.style.display =
        "block";


    clearTimeout(statusTimer);


    statusTimer =
        setTimeout(()=>{

            status.style.display =
                "none";

        },4000);

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* ==========================================
   START
========================================== */

renderWifi();

</script>

</body>
